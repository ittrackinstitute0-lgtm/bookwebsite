<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Book Haven</title>
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">📚</div>
      <h2>Book Haven Admin</h2>
      <p>Sign in to manage your bookstore</p>
    </div>

    <div id="alertBox" style="display:none;" class="alert alert-error">
      <span>⚠️</span>
      <span id="alertMsg">Invalid credentials</span>
    </div>

    <form class="login-form" id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="admin@bookhaven.pk" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div style="position:relative;">
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password" style="padding-right:44px;">
          <button type="button" onclick="togglePw()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;" id="eyeBtn">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:1rem;margin-top:8px;" id="loginBtn">
        🔐 Sign In
      </button>
    </form>

    <div style="text-align:center;margin-top:20px;font-size:0.82rem;color:#6c757d;">
      <a href="../index.html" style="color:#e94560;">← Back to Store</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase-config.js"></script>
<script>
  // Check if already logged in
  window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) window.location.href = 'dashboard.html';
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const alertBox = document.getElementById('alertBox');
    const alertMsg = document.getElementById('alertMsg');
    alertBox.style.display = 'none';

    btn.disabled = true;
    btn.innerHTML = '<span style="display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,0.4);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;"></span> Signing in...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
      window.location.href = 'dashboard.html';
    } catch (err) {
      alertMsg.textContent = err.message || 'Invalid email or password';
      alertBox.style.display = 'flex';
      btn.disabled = false;
      btn.innerHTML = '🔐 Sign In';
    }
  });

  function togglePw() {
    const pw = document.getElementById('password');
    const btn = document.getElementById('eyeBtn');
    if (pw.type === 'password') { pw.type = 'text'; btn.textContent = '🙈'; }
    else { pw.type = 'password'; btn.textContent = '👁️'; }
  }
</script>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</body>
</html>
