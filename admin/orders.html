<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders - Book Haven Admin</title>
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body>

<div class="admin-wrapper">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">📚</div>
      <div><div class="sidebar-logo-text">BookHaven</div><div class="sidebar-logo-sub">Admin Panel</div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-label">Main</div>
        <a href="dashboard.html" class="nav-item"><span class="nav-item-icon">📊</span> Dashboard</a>
        <a href="products.html" class="nav-item"><span class="nav-item-icon">📚</span> Books / Products</a>
        <a href="orders.html" class="nav-item active"><span class="nav-item-icon">🛒</span> Orders<span class="nav-item-badge" id="pendingBadge">0</span></a>
      </div>
      <div class="nav-section">
        <div class="nav-section-label">Shortcuts</div>
        <a href="../index.html" class="nav-item" target="_blank"><span class="nav-item-icon">🌐</span> View Store</a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="admin-profile" onclick="logout()">
        <div class="admin-avatar">A</div>
        <div class="admin-info"><div class="admin-name" id="adminEmail">Admin</div><div class="admin-role">Sign out →</div></div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    <header class="admin-header">
      <div class="header-title">🛒 Orders Management</div>
      <div class="header-search">
        <span>🔍</span>
        <input type="text" placeholder="Search by name, phone..." id="searchInput" oninput="filterOrders()">
      </div>
      <div class="header-actions">
        <button class="btn btn-light btn-sm" onclick="loadOrders()">🔄 Refresh</button>
        <a href="../index.html" target="_blank" class="btn btn-light btn-sm">🌐 Store</a>
      </div>
    </header>

    <div class="page-content">
      <!-- Status Filter Tabs -->
      <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;">
        <button class="btn btn-primary btn-sm status-tab active" data-status="all" onclick="setStatusFilter('all', this)">All Orders</button>
        <button class="btn btn-light btn-sm status-tab" data-status="pending" onclick="setStatusFilter('pending', this)" style="border-color:#ffc107;color:#856404;">⏳ Pending</button>
        <button class="btn btn-light btn-sm status-tab" data-status="confirmed" onclick="setStatusFilter('confirmed', this)" style="border-color:#007bff;color:#004085;">✅ Confirmed</button>
        <button class="btn btn-light btn-sm status-tab" data-status="processing" onclick="setStatusFilter('processing', this)" style="border-color:#17a2b8;color:#0c5460;">⚙️ Processing</button>
        <button class="btn btn-light btn-sm status-tab" data-status="shipped" onclick="setStatusFilter('shipped', this)" style="border-color:#f5a623;color:#7a5200;">🚚 Shipped</button>
        <button class="btn btn-light btn-sm status-tab" data-status="delivered" onclick="setStatusFilter('delivered', this)" style="border-color:#28a745;color:#155724;">📦 Delivered</button>
        <button class="btn btn-light btn-sm status-tab" data-status="cancelled" onclick="setStatusFilter('cancelled', this)" style="border-color:#dc3545;color:#721c24;">❌ Cancelled</button>
        <span id="orderCount" style="margin-left:auto;font-size:0.85rem;color:#6c757d;align-self:center;"></span>
      </div>

      <!-- Orders Table -->
      <div class="card">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Contact</th>
                <th>City</th>
                <th>Items</th>
                <th>Total</th>
                <th>Payment</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody">
              <tr><td colspan="10" style="text-align:center;padding:40px;color:#6c757d;">Loading orders...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Order Detail Modal -->
<div class="modal-overlay" id="orderModal" style="display:none;">
  <div class="modal" style="max-width:700px;">
    <div class="modal-header">
      <h3>📋 Order Details — <span id="modalOrderId"></span></h3>
      <button class="modal-close" onclick="document.getElementById('orderModal').style.display='none'">✕</button>
    </div>
    <div class="modal-body" id="orderModalBody">
      <div style="text-align:center;padding:30px;"><div class="spinner" style="margin:0 auto;"></div></div>
    </div>
    <div class="modal-footer">
      <select id="statusSelect" class="form-control" style="width:auto;">
        <option value="pending">⏳ Pending</option>
        <option value="confirmed">✅ Confirmed</option>
        <option value="processing">⚙️ Processing</option>
        <option value="shipped">🚚 Shipped</option>
        <option value="delivered">📦 Delivered</option>
        <option value="cancelled">❌ Cancelled</option>
      </select>
      <button class="btn btn-primary" id="updateStatusBtn">Update Status</button>
      <button class="btn btn-light" onclick="document.getElementById('orderModal').style.display='none'">Close</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase-config.js"></script>
<script>
let allOrders = [];
let currentStatusFilter = 'all';
let currentOrderId = null;

// Auth guard
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) return window.location.href = 'index.html';
  document.getElementById('adminEmail').textContent = session.user.email;
})();

async function logout() { await supabase.auth.signOut(); window.location.href = 'index.html'; }

function showToast(msg, type='success') {
  const container = document.getElementById('toastContainer');
  const icons = { success:'✅', error:'❌', info:'ℹ️' };
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span class="toast-icon">${icons[type]||'📢'}</span><span>${msg}</span>`;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity='0'; toast.style.transform='translateX(100px)'; setTimeout(()=>toast.remove(),300); }, 3000);
}

async function loadOrders() {
  const tbody = document.getElementById('ordersTableBody');
  tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:30px;color:#6c757d;">Loading...</td></tr>';
  try {
    const { data, error } = await supabase.from(TABLES.ORDERS).select('*').order('created_at', { ascending: false });
    if (error) throw error;
    allOrders = data || [];

    const pending = allOrders.filter(o=>o.status==='pending').length;
    document.getElementById('pendingBadge').textContent = pending;

    renderOrders();
  } catch(e) {
    tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:30px;color:#dc3545;">Error: ${e.message}</td></tr>`;
  }
}

function setStatusFilter(status, btn) {
  currentStatusFilter = status;
  document.querySelectorAll('.status-tab').forEach(t => { t.className = 'btn btn-light btn-sm status-tab'; t.style.borderColor=''; t.style.color=''; });
  btn.className = 'btn btn-primary btn-sm status-tab';
  renderOrders();
}

function filterOrders() { renderOrders(); }

function renderOrders() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  let filtered = allOrders;

  if (currentStatusFilter !== 'all') filtered = filtered.filter(o => o.status === currentStatusFilter);
  if (search) filtered = filtered.filter(o =>
    (o.customer_name||'').toLowerCase().includes(search) ||
    (o.customer_phone||'').toLowerCase().includes(search) ||
    (o.id||'').toLowerCase().includes(search)
  );

  document.getElementById('orderCount').textContent = filtered.length + ' orders';

  const statusMap = {
    pending:'status-pending', confirmed:'status-confirmed', processing:'status-processing',
    shipped:'status-shipped', delivered:'status-delivered', cancelled:'status-cancelled'
  };
  const payMap = { cod:'💵 COD', bank_transfer:'🏦 Bank', easypaisa:'📱 EasyPaisa' };

  const tbody = document.getElementById('ordersTableBody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:40px;">
      <div style="font-size:3rem;">📭</div>
      <div style="color:#6c757d;margin-top:8px;">No orders found</div>
    </td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(o => `
    <tr>
      <td><span style="font-weight:700;color:#e94560;font-size:0.85rem;">#${o.id.substring(0,8).toUpperCase()}</span></td>
      <td>
        <div style="font-weight:600;">${escHtml(o.customer_name)}</div>
        <div style="font-size:0.75rem;color:#6c757d;">${escHtml(o.customer_email||'')}</div>
      </td>
      <td style="font-size:0.85rem;">${escHtml(o.customer_phone||'-')}</td>
      <td style="font-size:0.85rem;">${escHtml(o.customer_city||'-')}</td>
      <td style="text-align:center;font-weight:700;">${o.items_count||'-'}</td>
      <td style="font-weight:700;color:#e94560;">Rs. ${Number(o.total_amount).toLocaleString()}</td>
      <td style="font-size:0.82rem;">${payMap[o.payment_method]||o.payment_method||'-'}</td>
      <td><span class="status-badge ${statusMap[o.status]||'status-pending'}">${o.status}</span></td>
      <td style="font-size:0.78rem;color:#6c757d;">
        ${new Date(o.created_at).toLocaleDateString('en-PK')}<br>
        ${new Date(o.created_at).toLocaleTimeString('en-PK',{hour:'2-digit',minute:'2-digit'})}
      </td>
      <td>
        <div style="display:flex;gap:4px;">
          <button class="btn btn-light btn-sm" onclick="viewOrder('${o.id}')">👁️ View</button>
        </div>
      </td>
    </tr>`).join('');
}

async function viewOrder(id) {
  currentOrderId = id;
  const order = allOrders.find(o => o.id === id);
  if (!order) return;

  document.getElementById('modalOrderId').textContent = '#' + id.substring(0,8).toUpperCase();
  document.getElementById('statusSelect').value = order.status;
  document.getElementById('orderModal').style.display = 'flex';

  const body = document.getElementById('orderModalBody');
  body.innerHTML = '<div style="text-align:center;padding:30px;"><div class="spinner" style="margin:0 auto;"></div></div>';

  // Load order items
  const { data: items } = await supabase.from(TABLES.ORDER_ITEMS).select('*').eq('order_id', id);

  const statusMap = { pending:'status-pending', confirmed:'status-confirmed', processing:'status-processing', shipped:'status-shipped', delivered:'status-delivered', cancelled:'status-cancelled' };
  const payMap = { cod:'💵 Cash on Delivery', bank_transfer:'🏦 Bank Transfer', easypaisa:'📱 EasyPaisa/JazzCash' };

  body.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;">
      <div style="background:#f8f9fa;border-radius:10px;padding:16px;">
        <div style="font-size:0.82rem;font-weight:700;color:#6c757d;margin-bottom:10px;text-transform:uppercase;letter-spacing:0.5px;">Customer Info</div>
        <div style="display:flex;flex-direction:column;gap:6px;font-size:0.88rem;">
          <div>👤 <strong>${escHtml(order.customer_name)}</strong></div>
          <div>📞 ${escHtml(order.customer_phone||'-')}</div>
          <div>📧 ${escHtml(order.customer_email||'-')}</div>
        </div>
      </div>
      <div style="background:#f8f9fa;border-radius:10px;padding:16px;">
        <div style="font-size:0.82rem;font-weight:700;color:#6c757d;margin-bottom:10px;text-transform:uppercase;letter-spacing:0.5px;">Delivery Info</div>
        <div style="display:flex;flex-direction:column;gap:6px;font-size:0.88rem;">
          <div>📍 ${escHtml(order.customer_address||'-')}</div>
          <div>🏙️ ${escHtml(order.customer_city||'-')}</div>
          <div>💳 ${payMap[order.payment_method]||order.payment_method}</div>
        </div>
      </div>
    </div>

    ${order.notes ? `<div style="background:#fff3cd;border-radius:8px;padding:12px;margin-bottom:16px;font-size:0.87rem;">📝 <strong>Notes:</strong> ${escHtml(order.notes)}</div>` : ''}

    <div style="font-weight:700;margin-bottom:12px;font-size:0.95rem;">📦 Order Items</div>
    <div style="border:1px solid #e0e0e0;border-radius:10px;overflow:hidden;margin-bottom:16px;">
      <table style="width:100%;border-collapse:collapse;font-size:0.87rem;">
        <thead style="background:#f8f9fa;">
          <tr>
            <th style="padding:10px 14px;text-align:left;font-weight:600;">Book</th>
            <th style="padding:10px 14px;text-align:center;font-weight:600;">Qty</th>
            <th style="padding:10px 14px;text-align:right;font-weight:600;">Price</th>
            <th style="padding:10px 14px;text-align:right;font-weight:600;">Total</th>
          </tr>
        </thead>
        <tbody>
          ${(items||[]).map(item=>`
          <tr style="border-top:1px solid #f0f0f0;">
            <td style="padding:10px 14px;">
              <div style="font-weight:600;">${escHtml(item.book_title||'Unknown')}</div>
              <div style="font-size:0.78rem;color:#6c757d;">${escHtml(item.book_author||'')}</div>
            </td>
            <td style="padding:10px 14px;text-align:center;">${item.quantity}</td>
            <td style="padding:10px 14px;text-align:right;">Rs. ${Number(item.unit_price).toLocaleString()}</td>
            <td style="padding:10px 14px;text-align:right;font-weight:700;color:#e94560;">Rs. ${Number(item.total_price).toLocaleString()}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>

    <div style="background:#f8f9fa;border-radius:10px;padding:16px;">
      <div style="display:flex;justify-content:space-between;font-size:0.9rem;margin-bottom:6px;"><span>Subtotal:</span><span>Rs. ${Number(order.subtotal||0).toLocaleString()}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:0.9rem;margin-bottom:6px;"><span>Shipping:</span><span>${Number(order.shipping_fee||0)===0?'<span style="color:#28a745">FREE</span>':'Rs. '+Number(order.shipping_fee||0).toLocaleString()}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:1rem;font-weight:800;color:#e94560;border-top:1px solid #e0e0e0;padding-top:10px;margin-top:4px;"><span>Total:</span><span>Rs. ${Number(order.total_amount).toLocaleString()}</span></div>
    </div>

    <div style="margin-top:14px;font-size:0.8rem;color:#6c757d;">
      🕐 Ordered on: ${new Date(order.created_at).toLocaleString('en-PK')}
    </div>`;

  // Update status handler
  document.getElementById('updateStatusBtn').onclick = async () => {
    const newStatus = document.getElementById('statusSelect').value;
    try {
      const { error } = await supabase.from(TABLES.ORDERS).update({ status: newStatus }).eq('id', currentOrderId);
      if (error) throw error;
      const o = allOrders.find(x=>x.id===currentOrderId);
      if (o) o.status = newStatus;
      showToast('Status updated to "' + newStatus + '"');
      renderOrders();
      document.getElementById('orderModal').style.display = 'none';
    } catch(e) { showToast('Error: '+e.message, 'error'); }
  };
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Read URL status param
const urlParams = new URLSearchParams(window.location.search);
const initStatus = urlParams.get('status');
if (initStatus) currentStatusFilter = initStatus;

// Load pending badge
(async () => {
  const { count } = await supabase.from(TABLES.ORDERS).select('id',{count:'exact'}).eq('status','pending');
  document.getElementById('pendingBadge').textContent = count||0;
})();

loadOrders();
</script>
</body>
</html>
