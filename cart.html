<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Book Haven</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
  <div class="container">
    <div>📦 Free delivery on orders above Rs. 2000 | 📞 0300-1234567</div>
    <div><a href="admin/index.html">🔐 Admin</a></div>
  </div>
</div>

<!-- Navbar -->
<nav class="navbar">
  <div class="container">
    <a href="index.html" class="logo">
      <div class="logo-icon">📚</div>
      <div class="logo-text">Book<span>Haven</span></div>
    </a>
    <form class="search-bar" action="products.html" method="get">
      <input type="text" name="search" placeholder="Search books...">
      <button type="submit">🔍</button>
    </form>
    <div class="nav-actions">
      <a href="cart.html" class="nav-link cart-icon">
        <span>🛒</span><span>Cart</span>
        <span class="cart-count" id="cartCount" style="display:none">0</span>
      </a>
    </div>
  </div>
</nav>

<!-- Page Header -->
<div class="page-header">
  <div class="container">
    <h1>🛒 Shopping Cart</h1>
    <div class="breadcrumb">
      <a href="index.html">Home</a><span class="sep">›</span><span>Cart</span>
    </div>
  </div>
</div>

<!-- Cart Content -->
<div class="cart-page">
  <div class="container">
    <div class="cart-grid">
      <div id="cartWrapper"></div>
      <div id="cartSummary"></div>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="footer" style="margin-top:40px;">
  <div style="background:rgba(0,0,0,0.2);">
    <div class="container"><div class="footer-bottom"><span>© 2024 BookHaven.</span></div></div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/main.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
